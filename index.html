<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mani uzdevumi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-container">
    <header class="app-header">
      <h1>Mani uzdevumi</h1>
    </header>

    <section class="input-section">
      <input 
        type="text" 
        id="task-input" 
        placeholder="Ievadiet jaunu uzdevumu..." 
        aria-label="Jauns uzdevums"
        autocomplete="off"
      >
      <input 
        type="date" 
        id="due-date-input" 
        aria-label="Izpildes termiņš"
        title="Izpildes termiņš"
      >
      <button type="button" id="add-btn">Pievienot</button>
    </section>

    <!-- U3: Statistikas panelis no skices -->
    <section class="stats-section" aria-label="Statistika">
      <h2>Statistika</h2>
      <div class="stats-cards">
        <div class="stat-card">
          <span class="stat-label">Kopā</span>
          <span id="stat-total" class="stat-value">0</span>
        </div>
        <div class="stat-card stat-completed">
          <span class="stat-label">Izpildīti</span>
          <span id="stat-completed" class="stat-value">0</span>
        </div>
        <div class="stat-card stat-overdue">
          <span class="stat-label">Nokavēti</span>
          <span id="stat-overdue" class="stat-value">0</span>
        </div>
      </div>
      <div class="progress-container">
        <div class="progress-bar-bg">
          <div id="stat-progress-bar" class="progress-bar-fill" style="width: 0%;"></div>
        </div>
        <span id="stat-progress-text" class="progress-text">0%</span>
      </div>
    </section>

    <section class="controls-section">
      <div class="filters" role="group" aria-label="Uzdevumu filtri">
        <button type="button" class="filter-btn active" data-filter="all">Visi</button>
        <button type="button" class="filter-btn" data-filter="active">Aktīvie</button>
        <button type="button" class="filter-btn" data-filter="completed">Izpildītie</button>
      </div>
      <span id="tasks-counter" class="counter">Atlikuši: 0</span><button type="button" id="sort-btn">Kārtot A‑Z</button><button type="button" id="clear-btn">Dzēst izpildītos</button>
    </section>

    <ul id="task-list" class="task-list"></ul>
  </main>

  <script src="app.js"></script>
</body>
</html>
